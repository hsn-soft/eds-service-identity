services:
  
  eds-service-identity-local:
    build:
      context: ../
      dockerfile: src/Eds.IdentityService.Http.Host/Dockerfile
      secrets:
        - NUGET_USER
        - NUGET_TOKEN
    container_name: eds-service-identity-local-container
    image: eds-service-identity-local:1.0.0
    restart: always
    stop_grace_period: 20s # wait graceful termination
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # tmpfs-folder
      - /tmp
    labels:
      - "autoheal=true"
    healthcheck:
      #test: ["CMD", "curl", "--silent", "-f", "http://127.0.0.1:9000/api"]
      test: curl --fail http://localhost:8080/ReadinessCheck || exit 1
      start_period: 20s
      interval: 30s # application healthcheck period with "curl --fail"
      timeout: 5s # application healthcheck response timeout.
      retries: 3 # If the application does not respond after 3 attempts, it will be marked as "unhealthy".
    ports:
      - "6610:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - BUILD_NUMBER=1.0.0
    networks:
      - infra-network

  # check healthy status and restart
  autoheal:
    image: willfarrell/autoheal:latest
    tty: true
    restart: always
    environment:
      - AUTOHEAL_START_PERIOD=120 # wait 120 seconds for the initialization of all applications.
      - AUTOHEAL_INTERVAL=20 # auto-heal check period - check the health status of all applications.
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10 # wait 10 seconds for the application to graceful shutdown.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

secrets:
  NUGET_USER:
    environment: NUGET_USER
  NUGET_TOKEN:
    environment: NUGET_TOKEN

networks:
  infra-network:
    name: local.infrastructure-network
    external: true